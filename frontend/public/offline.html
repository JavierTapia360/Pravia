<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1728" />
    <title>PRAVIA OS · Sin conexión</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#07111f; color:#eef4fb; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
      main { width:min(100%,480px); padding:34px; border:1px solid #26374c; border-radius:22px; background:#0b1728; box-shadow:0 28px 80px #0008; }
      img { width:64px; height:64px; border-radius:16px; }
      p { color:#9fb0c4; line-height:1.55; }
      button { border:0; border-radius:10px; padding:12px 18px; color:#07111f; background:#d6ab68; font:inherit; font-weight:700; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pravia-192.png" alt="" />
      <h1>Sin conexión al servidor</h1>
      <p>PRAVIA conserva únicamente el acceso visual básico. Las operaciones y cambios permanecen bloqueados para evitar conflictos o duplicados.</p>
      <button type="button" onclick="location.reload()">Intentar de nuevo</button>
    </main>
  </body>
</html>
