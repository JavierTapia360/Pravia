name: pravia-os

services:
  backend:
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      PRAVIA_DATABASE_MODE: cloud
      STORAGE_MODE: cloud
      CORS_ALLOWED_ORIGINS: ${PRAVIA_PUBLIC_ORIGIN:?Define PRAVIA_PUBLIC_ORIGIN}
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PRAVIA_HTTP_PORT:-8080}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../backend
      target: migrate
    profiles: ["maintenance"]
    env_file:
      - ../backend/.env.production
    environment:
      NODE_ENV: production
      PRAVIA_DATABASE_MODE: cloud
    command: ["npx", "prisma", "migrate", "deploy"]
